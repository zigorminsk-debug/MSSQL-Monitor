name: Build EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyodbc pillow pymssql
      - name: Selftest
        run: python main.py --selftest
      - name: Icon
        run: python make_icon.py
        shell: cmd
      - name: Build EXE
        run: pyinstaller --clean --noconfirm mssql_monitor.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSSQLMonitor
          path: dist/MSSQLMonitor/
